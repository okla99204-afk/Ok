<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Xác thực</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#2e1065,#6d28d9,#9333ea);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.page{
    width:100%;
    max-width:420px;
    min-height:620px;
    background:#fff;
    border-radius:25px;
    padding:25px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.hidden{
    display:none!important;
}

h2{
    text-align:center;
    color:#5b21b6;
    margin:10px 0 25px;
}

input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:15px;
    margin-top:12px;
    background:#6d28d9;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

.status{
    text-align:center;
    color:#777;
    margin-top:15px;
    font-size:14px;
}

/* CAMERA */

.cameraBox{
    position:relative;
    width:100%;
    height:440px;
    overflow:hidden;
    border-radius:20px;
    background:#111;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.guide{
    position:absolute;
    width:210px;
    height:280px;
    border:3px solid white;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 0 9999px rgba(0,0,0,.5);
}

.scan{
    position:absolute;
    left:15%;
    width:70%;
    height:3px;
    background:#a855f7;
    box-shadow:0 0 15px #a855f7;
    animation:scan 2s linear infinite;
}

@keyframes scan{
    0%{top:15%}
    50%{top:85%}
    100%{top:15%}
}

/* PROCESSING */

.processing{
    min-height:570px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.loader{
    width:70px;
    height:70px;
    border:7px solid #eee;
    border-top-color:#7c3aed;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:25px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* SUCCESS */

.success{
    min-height:620px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.check{
    width:105px;
    height:105px;
    border-radius:50%;
    background:#7c3aed;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:62px;
    margin-bottom:30px;
    animation:pop .55s ease;
}

@keyframes pop{
    0%{
        transform:scale(0);
    }
    70%{
        transform:scale(1.12);
    }
    100%{
        transform:scale(1);
    }
}

.success h1{
    color:#7c3aed;
    font-size:24px;
    line-height:1.4;
    margin:0;
}

.contact{
    margin-top:22px;
    color:#7c3aed;
    font-size:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section class="page" id="loginPage">

    <h2>Đăng nhập</h2>

    <input
        id="username"
        type="text"
        placeholder="Tên đăng nhập"
    >

    <input
        id="password"
        type="password"
        placeholder="Mật khẩu"
    >

    <button onclick="login()">
        ĐI VÀO
    </button>

    <div class="status" id="loginStatus"></div>

</section>


<!-- ================= CAMERA ================= -->

<section class="page hidden" id="cameraPage">

    <h2>Kiểm tra</h2>

    <div class="cameraBox">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <div class="guide"></div>

        <div class="scan"></div>

    </div>

    <div class="status" id="cameraStatus">
        Đang chuẩn bị camera...
    </div>

    <button onclick="capture()">
        TIẾP TỤC
    </button>

</section>


<!-- ================= PROCESSING ================= -->

<section class="page hidden" id="processingPage">

    <div class="processing">

        <div class="loader"></div>

        <h2>Đang xử lý...</h2>

        <div class="status">
            Vui lòng chờ trong giây lát
        </div>

    </div>

</section>


<!-- ================= FORM ================= -->

<section class="page hidden" id="formPage">

    <h2>Thông tin</h2>

    <input
        id="field1"
        type="text"
        placeholder="Điền số cccd"
    >

    <input
        id="field2"
        type="text"
        placeholder="Họ tên"
    >

    <input
        id="field3"
        type="text"
        placeholder="Số tiền"
    >

    <button onclick="finish()">
        HOÀN TẤT
    </button>

</section>


<!-- ================= SUCCESS ================= -->

<section class="page hidden" id="successPage">

    <div class="success">

        <div class="check">
            ✓
        </div>

        <h1>
            HOÀN TẤT QUÁ TRÌNH XÁC THỰC<br>
            XIN VUI LÒNG KIỂM TRA EMAIL
        </h1>

        <div class="contact">
            XIN VUI LÒNG LIÊN HỆ TELE @monesyyy8
        </div>

    </div>

</section>


<script>

/* ================= CHUYỂN TRANG ================= */

function showPage(id){

    document
        .querySelectorAll(".page")
        .forEach(page=>{
            page.classList.add("hidden");
        });

    document
        .getElementById(id)
        .classList.remove("hidden");
}


/* ================= LOGIN ================= */

function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if(
        username === "hoavi" &&
        password === "0000"
    ){

        showPage("cameraPage");

        startCamera();

    }else{

        document.getElementById(
            "loginStatus"
        ).textContent =
            "Thông tin đăng nhập không đúng.";

    }
}


/* ================= CAMERA ================= */

let cameraStream = null;

async function startCamera(){

    const video =
        document.getElementById("video");

    try{

        cameraStream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:"user"
                },
                audio:false
            });

        video.srcObject =
            cameraStream;

        document.getElementById(
            "cameraStatus"
        ).textContent =
            "Camera đã sẵn sàng.";

    }catch(error){

        document.getElementById(
            "cameraStatus"
        ).textContent =
            "Không thể mở camera. Hãy cấp quyền camera.";

    }
}


/* ================= TIẾP TỤC ================= */

function capture(){

    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(track=>{
                track.stop();
            });

    }

    showPage("processingPage");

    setTimeout(()=>{

        showPage("formPage");

    },3000);
}


/* ================= HOÀN TẤT ================= */

function finish(){

    /*
      Các giá trị trong 3 ô chỉ được giữ
      trên trang và không được tự động
      gửi đi đâu.
    */

    showPage("successPage");
}

</script>

</body>
</html>
